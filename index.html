<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HexBit Discord Inspired Website</title>
	<link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
	<div class="logindiv">
		<center><h1 class="Welcome">Welcome back!</h1></center>
		<center><p class="excited">We're so excited to see you again!</p></center>
		<p class="email">EMAIL OR PHONE NUMBER</p>
	<input type="text" class="username">
	<p class="passtext">PASSWORD</p>
	<input type="password" class="password">
	<a href="url" class="forgotpass">Forgot your password?</a>
	<button class="login">LOGIN</button>
	<p class="registertext">Need an account?</p>
	<a href="url" class="Register">Register</a>
	<img class="qrcode" src="images/qrcode.png" alt="qrcode">
	<p class="loginqr">Log in with QR Code</p>
	<p class="loginqrtext1">Scan this with the discord mobile</p>
    <p class="loginqrtext2">app to log in instantly</p>
	</div>

</body>
</html>
